# MIDIassistant 完整主题配置模板 (包含所有颜色和布局设置)
name = "我的专属主题"
description = "基于全字段生成"

[settings]
# 卷帘窗背景色
piano_bg_r = 22
piano_bg_g = 22
piano_bg_b = 22

# 钢琴键盘白键与黑键色
white_key_r = 240
white_key_g = 240
white_key_b = 240
black_key_r = 20
black_key_g = 20
black_key_b = 20

# 音符颜色（常规与高亮）
note_r = 100
note_g = 210
note_b = 100
active_note_r = 50
active_note_g = 200
active_note_b = 255

# 音名色、指针色
text_r = 0
text_g = 0
text_b = 0
cursor_r = 255
cursor_g = 255
cursor_b = 0

# 网格颜色（你这次报错缺少的就是这两行！）
grid_bright_r = 110
grid_bright_g = 110
grid_bright_b = 110
grid_dim_r = 50
grid_dim_g = 50
grid_dim_b = 50

# 布局与缩放设置
pitch_min = 40
pitch_range = 48
time_offset = 0.0
time_zoom = 1.0
follow_playhead = true
show_cursor = true